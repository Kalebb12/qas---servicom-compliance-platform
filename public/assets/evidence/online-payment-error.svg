  <circle cx="116" cy="93" r="7" fill="#f87171"/>
  <circle cx="140" cy="93" r="7" fill="#fbbf24"/>
  <circle cx="164" cy="93" r="7" fill="#34d399"/>
  <rect x="224" y="84" width="420" height="18" rx="9" fill="#334155"/>
