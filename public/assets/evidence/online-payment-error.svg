<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Sample online payment error evidence</title>
  <desc id="desc">A generic payment error screen with all personal details omitted.</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <rect x="80" y="64" width="800" height="472" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
